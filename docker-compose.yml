x-jwt: &jwt
  JWT_SECRET: ${JWT_SECRET:-chave-de-desenvolvimento-local-com-mais-de-32-caracteres}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pelada
      POSTGRES_USER: pelada
      POSTGRES_PASSWORD: pelada
    volumes:
      - dados:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pelada"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"

  auth:
    build: https://github.com/WallaksCardoso/spring-jwt-auth.git#main
    environment:
      <<: *jwt
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth
      SPRING_DATASOURCE_USERNAME: pelada
      SPRING_DATASOURCE_PASSWORD: pelada
      CORS_ORIGENS: http://localhost:3000
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      <<: *jwt
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pelada
      SPRING_DATASOURCE_USERNAME: pelada
      SPRING_DATASOURCE_PASSWORD: pelada
      PELADA_KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CORS_ORIGENS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  email:
    build: https://github.com/WallaksCardoso/email-service.git#main
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      SPRING_APPLICATION_JSON: '{"spring":{"mail":{"properties":{"mail.smtp.auth":"false","mail.smtp.starttls.enable":"false","mail.smtp.starttls.required":"false"}}}}'
    restart: on-failure
    depends_on:
      - kafka
      - mailpit

  front:
    build: https://github.com/WallaksCardoso/pelada-gestao-front-web.git#main
    ports:
      - "3000:80"
    depends_on:
      - auth
      - api

volumes:
  dados:
